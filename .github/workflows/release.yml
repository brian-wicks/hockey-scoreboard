name: Release desktop app

# Fires on a version tag. A GitHub Release with public download links is a visible, external
# action, so ordinary pushes to main don't publish one. A push that changes the version does:
# tag-release.yml tags it and starts this workflow on the tag through workflow_dispatch. See
# docs/offline-at-the-rink.md for the operator-facing side of this build.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# To create the release and upload build artifacts to it.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        # electron-builder names artifacts after package.json's version regardless
        # of which tag triggered the build. If they drift, the release ends up
        # labeled v1.12.0 but containing files named for 1.11.1 (or vice versa) —
        # fail loudly here instead of publishing that silently.
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version ($PKG_VERSION)." >&2
            echo "Bump package.json and retag, or delete/retag to match." >&2
            exit 1
          fi
      - run: npm run lint
      # Plain `npm run build` requires real Firebase client config, which this repo
      # has no CI secrets for. Build in local mode instead (same as the desktop
      # app build below) — it only needs to produce dist/index.html for the static-
      # file-serving tests, not a deployable production bundle.
      - run: VITE_LOCAL_MODE=true npm run build
      - run: npx vitest run

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      # electron-builder both packages this OS's installer and uploads it to the
      # GitHub Release for the pushed tag (creating the release on whichever
      # matrix job gets there first). Unsigned: there's no Apple/Microsoft
      # signing certificate configured, so macOS Gatekeeper and Windows
      # SmartScreen will both warn on first launch of a downloaded copy — see
      # docs/offline-at-the-rink.md.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    # Runs once, after all three installers are up, rather than from inside the
    # matrix: electron-builder's own release body (commit-range boilerplate) would
    # otherwise win a race against whichever platform sets notes first.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Set release notes from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx tsx scripts/release-notes.ts "$VERSION" > release-notes.md
          gh release edit "${GITHUB_REF#refs/tags/}" --notes-file release-notes.md
